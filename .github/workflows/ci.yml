name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Unit tests only: no network, no gateway, no embedding download.
      # scripts/verify.py needs a live gateway and a 67MB model, so it runs
      # locally before a PR instead of in CI.
      - run: PYTHONPATH=. python -m pytest tests -q
